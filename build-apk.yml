name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Buat ikon aplikasi
        run: |
          pip install pillow
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import glob
          S = 1024
          navy = (22, 35, 45, 255)
          green = (14, 138, 95, 255)
          mint = (221, 243, 234, 255)
          paths = (glob.glob('/usr/share/fonts/**/DejaVuSans-Bold.ttf', recursive=True)
                   + glob.glob('/usr/share/fonts/**/LiberationSans-Bold.ttf', recursive=True))
          font = ImageFont.truetype(paths[0], 250) if paths else ImageFont.load_default(250)
          glyph = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(glyph)
          c, r = S // 2, 330
          d.ellipse((c - r, c - r, c + r, c + r), fill=green)
          d.ellipse((c - r + 34, c - r + 34, c + r - 34, c + r - 34), outline=mint, width=14)
          d.text((c, c + 6), "Rp", font=font, fill=(255, 255, 255, 255), anchor="mm")
          bg = Image.new('RGBA', (S, S), navy)
          full = bg.copy()
          full.alpha_composite(glyph)
          bg.save('assets/icon-background.png')
          glyph.save('assets/icon-foreground.png')
          full.save('assets/icon-only.png')
          PY

      - name: Siapkan proyek Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install @capacitor/assets@3
          mkdir -p www
          cp index.html www/index.html
          npx cap init Keuangan com.catatan.keuangan --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: catatan-keuangan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
